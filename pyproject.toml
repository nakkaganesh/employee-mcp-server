[project]
name = "employee-mcp-server"
version = "0.1.0"
description = "AI-powered employee support agent using MCP, OpenAI, and MySQL"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "fastapi>=0.142.2",
    "mcp[cli]>=2.2.0",
    "mysql-connector-python>=26.7.0",
    "openai>=3.20.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.54.0",
]



[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
