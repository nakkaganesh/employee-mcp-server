version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "g", email = "g" }
]
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=2.2.0",
    "mysql-connector-python>=26.7.0",
