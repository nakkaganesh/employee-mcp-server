<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Employee MCP Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .header {
            margin-bottom: 20px;
        }

        .header h1 {
            margin-bottom: 8px;
        }

        .header p {
            margin-top: 0;
            color: #6b7280;
        }

        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
            margin-bottom: 20px;
        }

        .example-button {
            background: white;
            border: 1px solid #d1d5db;
            color: #374151;
            font-weight: normal;
        }

        .example-button:hover {
            background: #f3f4f6;
        }

        .chat-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        #messages {
            height: 500px;
            overflow-y: auto;
            padding: 24px;
        }

        .message {
            margin-bottom: 18px;
        }

        .message-label {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #6b7280;
        }

        .bubble {
            display: inline-block;
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user {
            text-align: right;
        }

        .user .bubble {
            background: #2563eb;
            color: white;
        }

        .assistant .bubble {
            background: #e5e7eb;
        }

        .approval {
            background: #fff7ed;
            border: 1px solid #fed7aa;
            border-radius: 10px;
            padding: 16px;
            margin-top: 10px;
        }

        .approval pre {
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .approval-actions {
            margin-top: 12px;
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .approve-button {
            background: #16a34a;
            color: white;
        }

        .reject-button {
            background: #dc2626;
            color: white;
        }

        .input-area {
            display: flex;
            gap: 10px;
            border-top: 1px solid #e5e7eb;
            padding: 18px;
        }

        #messageInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
        }

        #messageInput:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        #sendButton {
            background: #111827;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            font-size: 13px;
            color: #6b7280;
            padding: 0 18px 12px;
        }

        @media (max-width: 700px) {
            .container {
                margin: 10px auto;
                padding: 12px;
            }

            #messages {
                height: 60vh;
            }

            .bubble {
                max-width: 90%;
            }

            .input-area {
                flex-direction: column;
            }

            #sendButton {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>Employee MCP Assistant</h1>

        <p>
            AI employee support powered by OpenAI,
            Model Context Protocol and MySQL.
        </p>

        <div class="examples">

            <button
                class="example-button"
                data-prompt="How much leave does EMP002 have?"
            >
                Check Leave
            </button>


            <button
                class="example-button"
                data-prompt="Show all tickets for EMP001"
            >
                View Tickets
            </button>

            <button
                class="example-button"
                data-prompt="Create an IT ticket for EMP001 because my keyboard is not working"
            >
                Create Ticket
            </button>

        </div>

    </div>


    <div class="chat-card">

        <div id="messages">

            <div class="message assistant">

                <div class="message-label">
                    Assistant
                </div>

                <div class="bubble">
Hello! I can help with employee leave balances and IT support tickets.
                </div>

            </div>

        </div>


        <div
            id="status"
            class="status"
        ></div>


        <div class="input-area">

            <input
                id="messageInput"
                type="text"
                placeholder="Ask the Employee MCP Assistant..."
                autocomplete="off"
            >

            <button id="sendButton">
                Send
            </button>

        </div>

    </div>

</div>


<script>
    const messages =
        document.getElementById("messages");

    const input =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");

    const statusElement =
        document.getElementById("status");


    function addMessage(role, text) {

        const wrapper =
            document.createElement("div");

        wrapper.className =
            `message ${
                role === "user"
                    ? "user"
                    : "assistant"
            }`;


        const label =
            document.createElement("div");

        label.className =
            "message-label";

        label.textContent =
            role === "user"
                ? "You"
                : "Assistant";


        const bubble =
            document.createElement("div");

        bubble.className =
            "bubble";

        bubble.textContent =
            text;


        wrapper.appendChild(label);
        wrapper.appendChild(bubble);

        messages.appendChild(wrapper);

        messages.scrollTop =
            messages.scrollHeight;
    }


    function setLoading(loading) {

        sendButton.disabled =
            loading;

        input.disabled =
            loading;

        statusElement.textContent =
            loading
                ? "Assistant is thinking..."
                : "";
    }


    function addApproval(data) {

        const wrapper =
            document.createElement("div");

        wrapper.className =
            "message assistant";


        const label =
            document.createElement("div");

        label.className =
            "message-label";

        label.textContent =
            "Approval Required";


        const approval =
            document.createElement("div");

        approval.className =
            "approval";


        const description =
            document.createElement("div");

        description.textContent =
            `The assistant wants to execute: ${data.tool_name}`;


        const details =
            document.createElement("pre");

        details.textContent =
            JSON.stringify(
                data.arguments,
                null,
                2
            );


        const actions =
            document.createElement("div");

        actions.className =
            "approval-actions";


        const approveButton =
            document.createElement("button");

        approveButton.className =
            "approve-button";

        approveButton.textContent =
            "Approve";


        const rejectButton =
            document.createElement("button");

        rejectButton.className =
            "reject-button";

        rejectButton.textContent =
            "Reject";


        approveButton.addEventListener(
            "click",
            async () => {

                approveButton.disabled =
                    true;

                rejectButton.disabled =
                    true;

                try {

                    const response =
                        await fetch(
                            `/approve/${data.approval_id}`,
                            {
                                method: "POST"
                            }
                        );


                    const result =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            result.detail ||
                            "Approval failed."
                        );
                    }


                    wrapper.remove();


                    addMessage(
                        "assistant",
                        result.response
                    );

                } catch (error) {

                    approveButton.disabled =
                        false;

                    rejectButton.disabled =
                        false;

                    addMessage(
                        "assistant",
                        `Error: ${error.message}`
                    );
                }
            }
        );


        rejectButton.addEventListener(
            "click",
            async () => {

                approveButton.disabled =
                    true;

                rejectButton.disabled =
                    true;

                try {

                    const response =
                        await fetch(
                            `/approve/${data.approval_id}`,
                            {
                                method: "DELETE"
                            }
                        );


                    const result =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            result.detail ||
                            "Rejection failed."
                        );
                    }


                    wrapper.remove();


                    addMessage(
                        "assistant",
                        result.response
                    );

                } catch (error) {

                    approveButton.disabled =
                        false;

                    rejectButton.disabled =
                        false;

                    addMessage(
                        "assistant",
                        `Error: ${error.message}`
                    );
                }
            }
        );


        actions.appendChild(
            approveButton
        );

        actions.appendChild(
            rejectButton
        );


        approval.appendChild(
            description
        );

        approval.appendChild(
            details
        );

        approval.appendChild(
            actions
        );


        wrapper.appendChild(
            label
        );

        wrapper.appendChild(
            approval
        );


        messages.appendChild(
            wrapper
        );


        messages.scrollTop =
            messages.scrollHeight;
    }


    async function sendMessage() {

        const message =
            input.value.trim();


        if (!message) {
            return;
        }


        addMessage(
            "user",
            message
        );


        input.value = "";

        setLoading(true);


        try {

            const response =
                await fetch(
                    "/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                message: message
                            })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    "Request failed."
                );
            }


            if (data.approval_required) {

                addMessage(
                    "assistant",
                    data.response
                );

                addApproval(
                    data
                );

            } else {

                addMessage(
                    "assistant",
                    data.response
                );
            }


        } catch (error) {

            addMessage(
                "assistant",
                `Error: ${error.message}`
            );

        } finally {

            setLoading(false);

            input.focus();
        }
    }


    document
        .querySelectorAll(
            ".example-button"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        input.value =
                            button.dataset.prompt;

                        input.focus();
                    }
                );
            }
        );


    sendButton.addEventListener(
        "click",
        sendMessage
    );


    input.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter"
                && !event.repeat
            ) {
                sendMessage();
            }
        }
    );


    input.focus();
</script>

</body>
</html>
